<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>심은렬 다이아만들기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  /* 색 두 개가 이 프로젝트의 서사다. 구리 = 지금(브론즈), 청록 = 목표(다이아).
     액센트를 여기저기 뿌리지 않고 이 축에만 쓴다. */
  :root{
    --bg:#0a0c0f; --panel:#0f1216; --panel2:#12161b; --line:#232a33; --line2:#1c2027;
    --fg:#e9ecef; --fg2:#a8b0bb; --dim:#7c8490; --dim2:#5a626d; --faint:#3d444e;
    --bronze:#c88a4a; --bronze-t:#d9a877;
    --dia:#6fd3e8; --dia-t:#8fdff0;
    --win:#5fd08a; --lose:#f0736a; --lose-t:#f0a58a;
  }
  *{box-sizing:border-box}
  /* 한글은 기본값이면 어절 한가운데서 잘린다("제어 와드를 매 귀 / 환마다").
     keep-all 이면 띄어쓰기에서만 끊긴다. pretty 는 마지막 줄에 한 단어만
     남는 것을 막는다. */
  html{background:var(--bg);word-break:keep-all;overflow-wrap:break-word}
  p,li,td,th,div,span,h1,h2,h3{text-wrap:pretty}
  h1,h2,.champ-name,.big{text-wrap:balance}
  body{margin:0;color:var(--fg);font:14px/1.6 "IBM Plex Sans KR","Malgun Gothic",system-ui,sans-serif;
       -webkit-font-smoothing:antialiased;
       background:
         radial-gradient(900px 420px at 12% -8%, #16232b 0%, rgba(10,12,15,0) 62%),
         radial-gradient(700px 380px at 96% 4%, #1b1726 0%, rgba(10,12,15,0) 58%),
         var(--bg);
       background-attachment:fixed}
  .mono{font-family:"IBM Plex Mono",Consolas,monospace;font-variant-numeric:tabular-nums}
  a{color:#7fd8ec} a:hover{color:#a8e6f4}

  header{display:flex;align-items:center;justify-content:space-between;gap:20px;
         padding:22px 40px 18px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
  .brand{display:flex;align-items:baseline;gap:14px}
  .brand h1{font-size:17px;font-weight:700;letter-spacing:-.01em;margin:0}
  .chip{display:flex;align-items:center;gap:7px;padding:5px 12px;border-radius:999px;
        font-size:11.5px;letter-spacing:.06em;white-space:nowrap}
  .chip.now{background:rgba(200,138,74,.10);border:1px solid rgba(200,138,74,.30);color:var(--bronze-t)}
  .chip.goal{background:rgba(111,211,232,.08);border:1px solid rgba(111,211,232,.26);color:var(--dia-t)}

  nav{display:flex;padding:0 40px;border-bottom:1px solid var(--line2)}
  nav button{background:none;border:0;color:var(--dim);padding:13px 4px;margin-right:26px;
             font:inherit;font-size:13.5px;cursor:pointer;box-shadow:inset 0 -2px 0 transparent}
  nav button.on{color:var(--fg);font-weight:600;box-shadow:inset 0 -2px 0 var(--dia)}

  main{padding:26px 40px 44px;max-width:1360px}
  section{display:none} section.on{display:flex;flex-direction:column;gap:22px}
  .card{border-radius:14px;border:1px solid var(--line);background:var(--panel)}
  .pad{padding:18px 24px}
  .eyebrow{font-size:11px;font-weight:600;color:var(--dim);letter-spacing:.16em}
  .muted{color:var(--dim)} .faint{color:var(--dim2)}
  .err{color:var(--lose)}
  .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .spread{display:flex;align-items:baseline;justify-content:space-between;gap:24px;flex-wrap:wrap}

  /* 기준 챔프 카드 — 스플래시를 배경으로 깔고 어둡게 처리한다 */
  .champs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
  .champ-card{position:relative;overflow:hidden;border-radius:14px;border:1px solid var(--line);
              min-height:172px;display:flex;align-items:center;gap:20px;padding:0 24px}
  .champ-card .splash{position:absolute;inset:0;background-size:cover;background-position:center 30%;
                      transform:scale(1.06);filter:blur(1px)}
  .champ-card .veil{position:absolute;inset:0;
       background:linear-gradient(90deg, rgba(10,12,15,.97) 0%, rgba(10,12,15,.88) 42%, rgba(10,12,15,.42) 100%)}
  .champ-card .ph{background:linear-gradient(135deg,#243447 0%,#161b22 60%,#10141a 100%)}
  .champ-card > .body{position:relative;display:flex;align-items:center;gap:20px}
  .champ-name{font-size:22px;font-weight:700;letter-spacing:-.02em}

  /* 챔프 아이콘 = 64px 원형 */
  .ico{width:64px;height:64px;border-radius:50%;flex:0 0 64px;object-fit:cover;
       background:var(--panel2);border:1px solid var(--line);
       display:flex;align-items:center;justify-content:center;
       font-size:11px;color:var(--dim);text-align:center;overflow:hidden}
  .ico.cur{border:2px solid rgba(111,211,232,.45);box-shadow:0 0 0 4px rgba(111,211,232,.08)}
  .ico.md{width:34px;height:34px;flex-basis:34px;font-size:9px}
  .ico.sm{width:30px;height:30px;flex-basis:30px;font-size:9px}
  .ico.dim{opacity:.72}

  .bar{height:6px;border-radius:999px;background:#171b21;overflow:hidden;position:relative;flex-grow:1}
  .bar>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--bronze),#e0a86a)}
  .bar .ghost{position:absolute;inset:0;background:linear-gradient(90deg,var(--bronze),var(--dia));opacity:.14}
  .bar.thin{height:5px}
  .bar.thin>i{background:var(--dia)}

  .task{border-radius:14px;border:1px solid rgba(111,211,232,.26);
        background:linear-gradient(180deg, rgba(111,211,232,.055), rgba(111,211,232,.015));padding:20px 24px}
  .tick{width:3px;height:13px;border-radius:2px;background:var(--dia);display:inline-block}

  table{border-collapse:collapse;width:100%}
  th{font-size:10.5px;color:var(--dim2);letter-spacing:.1em;font-weight:500;text-align:left;
     padding:0 8px 9px;border-bottom:1px solid var(--line2)}
  td{padding:11px 8px;border-bottom:1px solid #15191e;font-size:13.5px;vertical-align:middle}
  tr:last-child td{border-bottom:0}
  .num{text-align:right}
  .pill{display:inline-block;padding:2px 7px;border-radius:5px;font-size:10px;white-space:nowrap}
  .pill.cur{background:rgba(111,211,232,.13);color:var(--dia-t)}
  .pill.warn{background:rgba(200,138,74,.12);color:var(--bronze-t)}

  .stars{display:flex;gap:5px;justify-content:flex-end}
  .stars button{width:29px;height:29px;border-radius:8px;border:1px solid var(--line);
                background:var(--panel2);color:var(--dim);font:inherit;font-size:12px;cursor:pointer;
                font-family:"IBM Plex Mono",monospace}
  .stars button:hover{border-color:var(--dia);color:var(--fg)}
  .stars button.on{background:var(--dia);border-color:var(--dia);color:#07222a;font-weight:600}
  .btn{padding:8px 16px;border-radius:8px;border:1px solid rgba(111,211,232,.34);
       background:rgba(111,211,232,.09);color:var(--dia-t);font:inherit;font-size:13px;cursor:pointer}
  .btn:hover{background:rgba(111,211,232,.16);border-color:var(--dia)}
  .btn:disabled{opacity:.5;cursor:default}
  /* 부라인이 걸렸을 때 뭘 해야 하는지 — 솔랭은 라인을 고를 수 없다 */
  .fallback{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:11px 16px;
            border-radius:11px;background:var(--panel2);border:1px solid var(--line2)}
  /* 재미 점수를 안 남긴 판 — 남겨야 할 게 남아 있다는 걸 한눈에 */
  tr.unrated{background:linear-gradient(90deg, rgba(200,138,74,.10), rgba(200,138,74,0) 55%)}
  tr.unrated td:first-child{box-shadow:inset 3px 0 0 var(--bronze)}
  tr.unrated .stars button{border-color:rgba(200,138,74,.45);color:var(--bronze-t);
                           background:rgba(200,138,74,.07)}
  tr.unrated .stars button:hover{border-color:var(--dia);background:var(--panel2);color:var(--fg)}
  tr.rated{background:linear-gradient(90deg, rgba(111,211,232,.05), rgba(111,211,232,0) 60%)}
  .nag{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:12px;
       background:rgba(200,138,74,.08);border:1px solid rgba(200,138,74,.34);margin-bottom:14px}

  .stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
  .stat{border-radius:12px;border:1px solid var(--line2);background:var(--panel);padding:16px 18px}
  .stat .k{font-size:11px;color:var(--dim);margin-bottom:9px}
  .stat .v{font-size:27px;font-weight:600}
  .stat .s{font-size:10.5px;color:var(--dim2);margin-top:6px}

  .gap{display:grid;grid-template-columns:220px 1fr 160px;gap:22px;align-items:center}
  .gbar{height:19px;border-radius:5px;background:var(--panel2);overflow:hidden;flex-grow:1}
  .gbar>i{display:block;height:100%;border-radius:5px}

  /* 리포트 마크다운 */
  .md h1{font-size:20px;margin:22px 0 10px} .md h2{font-size:16px;margin:26px 0 10px}
  .md h3{font-size:14px;margin:20px 0 8px;color:var(--fg2)}
  .md p{margin:9px 0;color:var(--fg2)} .md li{color:var(--fg2)}
  .md hr{border:0;border-top:1px solid var(--line2);margin:22px 0}
  .md code{background:var(--panel2);padding:1px 6px;border-radius:4px;font-size:12px;
           font-family:"IBM Plex Mono",monospace}
  .md table{margin:10px 0 18px;font-size:12.5px}
  .md td{padding:8px;font-size:12.5px}
  .md em{color:var(--dim);font-style:normal;font-size:12px}
  .scroll{overflow-x:auto}
  input[type=text]{background:var(--panel2);border:1px solid var(--line);color:var(--fg);
                   border-radius:8px;padding:8px 12px;font:inherit;font-size:13px;min-width:300px}
  input[type=text]::placeholder{color:var(--dim2)}
  @media (max-width:900px){
    header,nav,main{padding-left:18px;padding-right:18px}
    .champs{grid-template-columns:1fr} .stats{grid-template-columns:repeat(2,1fr)}
    .gap{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1>심은렬 다이아만들기</h1>
    <span class="mono muted" style="font-size:12px;letter-spacing:.04em" id="who"></span>
  </div>
  <div class="row" style="gap:10px" id="tier"></div>
</header>
<nav>
  <button data-tab="today" class="on">오늘</button>
  <button data-tab="explore">탐색</button>
  <button data-tab="report">진단</button>
  <button data-tab="coach">코치</button>
</nav>
<main>
  <section id="today" class="on"><p class="muted">불러오는 중…</p></section>
  <section id="explore"><p class="muted">불러오는 중…</p></section>
  <section id="report"><p class="muted">불러오는 중…</p></section>
  <section id="coach"><p class="muted">불러오는 중…</p></section>
</main>

<script>
// ---------------------------------------------------------------- 이미지 --
// Data Dragon 원본을 직접 붙인다. 버전은 /today 가 내려준다.
//   아이콘   /cdn/<ver>/img/champion/<Champ>.png
//   스플래시 /cdn/img/champion/splash/<Champ>_0.jpg
const DD = "https://ddragon.leagueoflegends.com";
let VER = null;
const champIcon   = n => (VER && n) ? `${DD}/cdn/${VER}/img/champion/${n}.png` : null;
const champSplash = n => n ? `${DD}/cdn/img/champion/splash/${n}_0.jpg` : null;

let KO = {};
const ko = n => KO[n] || n;
// 라인 이름은 챔프 한글맵에 없다. 리포트/탐색 화면과 같은 표기를 쓴다.
const ROLE_KO = {TOP:"탑", JUNGLE:"정글", MIDDLE:"미드", BOTTOM:"원딜", UTILITY:"서폿"};
const rko = r => ROLE_KO[r] || r;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num = (v,d=2) => (v===null||v===undefined) ? "—" : Number(v).toFixed(d);
const pct = (v,d=1) => (v===null||v===undefined) ? "—" : (Number(v)*100).toFixed(d)+"%";
const signed = v => (v===null||v===undefined) ? "—"
  : (v<0 ? "−"+Math.abs(Math.round(v)) : "+"+Math.round(v));

async function get(p){
  const r = await fetch(p);
  if(!r.ok){ let d=""; try{ d=(await r.json()).detail||""; }catch(e){}
             throw new Error(d || `${p} — HTTP ${r.status}`); }
  return r.json();
}
const fail = (sel,e) => $(sel).innerHTML =
  `<div class="card pad"><p class="err">${esc(e.message)}</p></div>`;

// 이미지가 아직 없거나 CDN 이 막히면 챔프명 텍스트로 떨어진다
function icon(name, cls){
  const url = champIcon(name), full = esc(ko(name));
  const short = cls && cls.includes("sm") ? full.slice(0,2) : full;
  return url
    ? `<img class="ico ${cls||""}" src="${url}" alt="${full}" title="${full}"
         onerror="this.replaceWith(Object.assign(document.createElement('div'),
                  {className:'ico ${cls||""}',textContent:'${short}',title:'${full}'}))">`
    : `<div class="ico ${cls||""}" title="${full}">${short}</div>`;
}

// ------------------------------------------------------- 미니 마크다운 --
// 리포트는 제목·표·굵게가 거의 전부다. 로컬 도구라 오프라인에서도 떠야 해서
// 외부 라이브러리를 받아오지 않는다.
function md(src){
  const inline = t => esc(t)
    .replace(/`([^`]+)`/g,"<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")
    .replace(/(^|\W)_([^_]+)_(?=\W|$)/g,"$1<em>$2</em>");
  const L = String(src).split(/\r?\n/); const out=[]; let i=0,para=[],list=null;
  const fp=()=>{ if(para.length){ out.push(`<p>${inline(para.join(" "))}</p>`); para=[]; } };
  const fl=()=>{ if(list){ out.push(`</${list}>`); list=null; } };
  const isRow=s=>/^\s*\|.*\|\s*$/.test(s);
  const cells=s=>s.trim().replace(/^\||\|$/g,"").split("|").map(c=>c.trim());
  while(i<L.length){
    const line=L[i];
    if(isRow(line)&&isRow(L[i+1]||"")&&/^[\s|:-]+$/.test(L[i+1])){
      fp();fl(); const head=cells(line); i+=2; const body=[];
      while(i<L.length&&isRow(L[i])){ body.push(cells(L[i])); i++; }
      out.push(`<div class="scroll"><table><thead><tr>${
        head.map(h=>`<th>${inline(h)}</th>`).join("")}</tr></thead><tbody>${
        body.map(r=>"<tr>"+r.map(c=>`<td>${inline(c)}</td>`).join("")+"</tr>").join("")
      }</tbody></table></div>`); continue;
    }
    const h=line.match(/^(#{1,4})\s+(.*)$/);
    if(h){ fp();fl(); out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`); i++; continue; }
    if(/^\s*---+\s*$/.test(line)){ fp();fl(); out.push("<hr>"); i++; continue; }
    const li=line.match(/^\s*([-*]|\d+\.)\s+(.*)$/);
    if(li){ fp(); const w=/^\d/.test(li[1])?"ol":"ul";
            if(list!==w){ fl(); out.push(`<${w}>`); list=w; }
            out.push(`<li>${inline(li[2])}</li>`); i++; continue; }
    if(!line.trim()){ fp();fl(); i++; continue; }
    fl(); para.push(line.trim()); i++;
  }
  fp();fl(); return `<div class="md">${out.join("\n")}</div>`;
}
// 코치 메모에서 한 섹션만 꺼낸다 (**제목** 다음 문단)
function section(memo, title){
  const m = String(memo||"").split(/\n(?=\*\*)/)
    .find(b => b.startsWith(`**${title}**`));
  // "**한 줄 요약** — 본문" 형태라 제목을 떼면 앞의 대시가 남는다
  return m ? m.replace(`**${title}**`,"").replace(/^\s*[—–-]\s*/,"").trim() : null;
}

// 솔랭은 라인 2개를 걸어야 해서 원하는 라인만 15판 할 수가 없다.
// 부라인이 걸리면 그 라인 기준 챔프를 하면 그 라인 진행으로 쌓인다(순서 위반 표시).
function fallbackHint(p, d){
  const all = d.all_champs || {};
  const others = (p.order||[]).filter(r => r !== p.current_role);
  if(!others.length) return "";
  return `<div class="fallback">
    <span class="mono" style="font-size:10.5px;color:var(--bronze-t);padding:2px 8px;
          border-radius:5px;background:rgba(200,138,74,.12)">부라인이 걸리면</span>
    <span style="font-size:12.5px;color:var(--fg2)">그 라인 기준 챔프를 하세요 — 그 라인 15판에 쌓입니다.</span>
    ${others.map(r => `<span class="mono" style="font-size:11.5px;color:var(--dim)">
      ${esc(rko(r))} <span style="color:var(--fg2)">${(all[r]||[]).map(c=>esc(ko(c))).join("·")}</span></span>`).join("")}
  </div>`;
}

// ------------------------------------------------------------- 오늘 --
async function loadToday(){
  let d; try{ d = await get("/today"); }catch(e){ return fail("#today",e); }
  KO = d.champ_ko || {}; VER = d.ddragon_version;
  $("#who").textContent = (d.riot_id||"") + " · KR";
  $("#tier").innerHTML = !d.tier ? "" : `
    <span class="chip now"><span style="width:6px;height:6px;border-radius:50%;background:var(--bronze)"></span>
      <span class="mono">${esc(d.tier)} ${esc(d.rank||"")} · ${d.lp} LP</span></span>
    <svg width="18" height="10" viewBox="0 0 18 10" fill="none"><path d="M1 5h15m0 0-4-4m4 4-4 4"
      stroke="#3d444e" stroke-width="1.4" stroke-linecap="round"/></svg>
    <span class="chip goal"><svg width="11" height="11" viewBox="0 0 12 12" fill="none">
      <path d="M6 1 11 6l-5 5L1 6z" stroke="#6fd3e8" stroke-width="1.3" stroke-linejoin="round"/></svg>
      <span class="mono">DIAMOND</span></span>`;

  const p = d.phase;
  const cards = !p ? "" : `<div class="champs">${(p.current_champs||[]).map((c,idx)=>{
    const sp = champSplash(c);
    return `<div class="champ-card">
      ${sp ? `<div class="splash" style="background-image:url('${sp}')"></div>` : `<div class="splash ph"></div>`}
      <div class="veil"></div>
      <div class="body">${icon(c, idx===0?"cur":"")}
        <div>
          <div class="champ-name">${esc(ko(c))}</div>
          <div class="mono" style="font-size:11.5px;color:var(--dim);letter-spacing:.05em;margin-top:4px">
            ${esc(c.toUpperCase())} · 기준 챔프</div>
          <div class="row" style="gap:6px;margin-top:9px">
            <span class="mono pill" style="background:rgba(255,255,255,.05);color:var(--fg2)">${p.current_games} / ${p.current_target}판</span>
            ${idx===0?'<span class="mono pill cur">지금</span>':''}
          </div>
        </div>
      </div></div>`; }).join("")}</div>`;

  const hero = !p ? "" : `
    <div style="display:flex;flex-direction:column;gap:14px">
      <div class="spread">
        <div class="row" style="gap:12px;align-items:baseline">
          <span class="eyebrow">지금 할 것</span>
          <span style="font-size:20px;font-weight:700;letter-spacing:-.015em">
            ${p.current_role ? esc(rko(p.current_role)) : "전 라인 목표 달성"}
            ${p.current_role ? `<span class="faint" style="font-weight:400"> · </span>
              <span class="mono" style="font-size:17px;color:var(--dia-t)">${p.current_left}판</span>
              <span style="font-size:15px;color:var(--fg2);font-weight:400"> 남았습니다</span>` : ""}</span>
        </div>
        <div class="mono muted" style="font-size:12px">탐색 순서 &nbsp;${
          (p.order||[]).map(r => r===p.current_role
            ? `<span style="color:var(--fg)">${esc(rko(r))}</span>` : esc(rko(r))).join(" → ")}</div>
      </div>
      ${cards}
      <div class="row" style="gap:16px;margin-top:2px;flex-wrap:nowrap">
        <div class="bar"><div class="ghost"></div>

// 판 하나가 이번 주 과제를 지켰는지 — 초록 체크 / 빨간 X 로 바로 보이게
function taskCell(task, cfg){
  if(!task || task.value === null || task.value === undefined)
    return `<span class="faint" style="font-size:12px">—</span>`;
  const ok = task.ok, c = ok ? "var(--win)" : "var(--lose)";
  const mark = ok
    ? '<path d="M3.4 8.4 6.4 11.4l6.2-6.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>'
    : '<path d="M4.6 4.6l6.8 6.8M11.4 4.6l-6.8 6.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>';
  return `<span class="row" style="gap:6px;color:${c};flex-wrap:nowrap"
      title="${esc(cfg?.label||"")} ${task.value}${esc(cfg?.unit||"")} · 목표 ${cfg?.min}${esc(cfg?.unit||"")} 이상">
    <svg width="15" height="15" viewBox="0 0 16 16" fill="none">${mark}</svg>
    <span class="mono" style="font-size:12.5px">${task.value}${esc(cfg?.unit||"")}</span></span>`;
}

async function runCollect(){
  const b=$("#collectBtn"), m=$("#collectMsg");
  if(!b) return;
  b.disabled=true; const old=b.textContent; b.textContent="가져오는 중…"; m.textContent="";
  try{
    const r=await fetch("/collect",{method:"POST"});
    const j=await r.json();
    if(!r.ok) throw new Error(j.detail || `HTTP ${r.status}`);
    m.textContent = j.new_matches ? `새 경기 ${j.new_matches}판을 받았습니다.` : "새 경기가 없습니다.";
    m.style.color = j.new_matches ? "var(--win)" : "var(--dim)";
    loaded.explore=false; loaded.report=false; loaded.coach=false;
    await loadToday();
  }catch(e){ m.textContent="실패: "+e.message; m.style.color="var(--lose)"; }
  finally{ const bb=$("#collectBtn"); if(bb){ bb.disabled=false; bb.textContent=old; } }
}

async function sendRate(match_id, score){
  const memo = ($("#rateMemo")?.value||"").trim() || null;
  try{
    const r = await fetch("/rate",{method:"POST",headers:{"Content-Type":"application/json"},
                                  body:JSON.stringify({score,memo,match_id})});
    if(!r.ok) throw new Error((await r.json()).detail || `HTTP ${r.status}`);
    await loadToday();
    if(loaded.explore) await loadExplore();   // 재미 점수는 적합도에 30% 들어간다
  }catch(e){ alert("기록 실패: " + e.message); }
}

      const max = Math.max(g.mine,g.bench)||1;
      const worse = g.pct ? g.mine < g.bench : (g.label.includes("데스") ? g.mine > g.bench : g.mine < g.bench);
      const delta = g.pct ? ((g.mine-g.bench)*100).toFixed(1)+"%p"
                          : (g.mine-g.bench>=0?"+":"−")+Math.abs(g.mine-g.bench).toFixed(2);
      return `${i?'<div style="height:1px;background:#1a1e24"></div>':''}
      <div class="gap">
        <div><div style="font-size:14px;font-weight:600">${esc(g.label)}</div>
          <div class="muted" style="font-size:11.5px;margin-top:3px">${esc(g.sub)}</div></div>
        <div style="display:flex;flex-direction:column;gap:7px">
          <div class="row" style="gap:11px;flex-wrap:nowrap">
            <span class="mono muted" style="font-size:10.5px;width:52px">나</span>
            <div class="gbar"><i style="width:${g.mine/max*100}%;background:var(--lose)"></i></div>
            <span class="mono" style="font-size:12.5px;color:var(--lose-t);width:58px;text-align:right">${f(g.mine)}</span></div>
          <div class="row" style="gap:11px;flex-wrap:nowrap">
            <span class="mono muted" style="font-size:10.5px;width:52px">${esc(g.bench_tier)}</span>
            <div class="gbar"><i style="width:${g.bench/max*100}%;background:${
              g.bench_tier==="BRONZE"?"var(--bronze);opacity:.5":"var(--dia);opacity:.55"}"></i></div>
            <span class="mono" style="font-size:12.5px;color:${
              g.bench_tier==="BRONZE"?"var(--bronze-t)":"var(--dia-t)"};width:58px;text-align:right">${f(g.bench)}</span></div>
        </div>
        <div style="text-align:right">
          <div class="mono" style="font-size:21px;font-weight:600;color:${worse?"var(--lose)":"var(--win)"}">${delta}</div>
          <div class="faint" style="font-size:10.5px;margin-top:3px">${esc(g.note)}</div></div>
      </div>`;}).join("")}</div></div>`;

  const lanes = !(d.lanes||[]).length ? "" : `<div class="card" style="overflow:hidden">
    <div class="row" style="gap:12px;padding:20px 24px 14px;align-items:baseline">
      <span class="eyebrow">라인별</span>
      <span class="muted" style="font-size:12.5px">15판도 안 한 라인은 숫자를 믿지 마세요</span></div>
    <div class="scroll" style="padding:0 24px 8px"><table>
      <thead><tr><th>라인</th><th class="num">판수</th><th class="num">승률</th>
        <th class="num">판당 데스</th><th class="num">15분 골드차</th></tr></thead>
      <tbody>${d.lanes.map(l=>`<tr>
        <td><span style="font-weight:600">${esc(l.role_ko)}</span>
          ${l.low_sample?' <span class="pill warn">표본 부족</span>':''}</td>
        <td class="mono num" style="color:${l.low_sample?"var(--dim)":"var(--fg)"}">${l.games}</td>
        <td class="mono num" style="color:${l.low_sample?"var(--dim)":(l.winrate>=0.5?"var(--win)":"var(--lose-t)")}">${pct(l.winrate)}</td>
        <td class="mono num" style="color:${l.low_sample?"var(--dim)":"var(--fg)"}">${num(l.deaths)}</td>
        <td class="mono num" style="color:${l.gold15_diff==null?"var(--dim2)":(l.gold15_diff<0?"var(--lose)":"var(--win)")}">${signed(l.gold15_diff)}</td>
      </tr>`).join("")}</tbody></table></div></div>`;

  $("#report").innerHTML = stats + gaps + lanes +
    `<div class="card pad"><details><summary style="cursor:pointer;color:var(--dim);font-size:12.5px;
       padding:2px 0">숫자 전부 보기 (긴 리포트)</summary>${md(d.markdown)}</details></div>`;
}

// ------------------------------------------------------------- 코치 --
async function loadCoach(){
  let d; try{ d = await get("/coach"); }catch(e){ return fail("#coach",e); }
  const memo = d.memo || "";
  const head = section(memo,"한 줄 요약");
  const cost = (d.input_tokens*5 + d.output_tokens*25)/1e6;
  const body = memo.split(/\n(?=\*\*)/).filter(b=>!b.startsWith("**한 줄 요약**")).join("\n");

  $("#coach").innerHTML = `
    <div style="display:flex;gap:26px;flex-wrap:wrap;align-items:flex-start">
      <div style="flex-grow:1;min-width:520px;max-width:800px;display:flex;flex-direction:column;gap:20px">
        ${head?`<div>
          <div class="eyebrow" style="margin-bottom:12px">한 줄 요약</div>
          <div style="font-size:22px;font-weight:600;line-height:1.62;letter-spacing:-.015em">
            ${md(head).replace(/^<div class="md"><p>|<\/p>\n?<\/div>$/g,"")}</div></div>`:""}
        <div style="height:1px;background:#1a1e24"></div>
        <div class="task">
          <div class="row" style="gap:10px;margin-bottom:12px">
            <span class="tick"></span>
            <span class="eyebrow" style="color:var(--dia-t)">이번 주 과제</span>
            <span class="mono" style="margin-left:auto;font-size:10.5px;color:#5a7f8a">사용자가 정한 과제</span></div>
          <div style="font-size:16px;font-weight:600;line-height:1.7">${esc(d.weekly_task)}</div></div>
        ${md(body)}
      </div>
      <div style="width:326px;display:flex;flex-direction:column;gap:14px">
        <div class="card pad">
          <div class="eyebrow" style="margin-bottom:5px">이 메모 믿어도 되나요</div>
          <div class="muted" style="font-size:12.5px;margin-bottom:14px">약속한 규칙을 지켰는지 자동으로 확인합니다.</div>
          ${[["분량", `${memo.length} / 900자`, memo.length<=900],
             ["이번 주 과제", (memo.match(/\*\*이번 주 과제\*\*/g)||[]).length+"개",
              (memo.match(/\*\*이번 주 과제\*\*/g)||[]).length===1],
             ["라인 판단", memo.includes("유보")?"유보":"확인 필요", memo.includes("유보")],
             ["추정 표기", memo.includes("추정")?"있음":"없음", memo.includes("추정")]
            ].map(([k,v,ok])=>`
            <div class="row" style="gap:11px;margin-bottom:11px;flex-wrap:nowrap">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="none">${ok
                ? '<path d="M3.4 8.4 6.4 11.4l6.2-6.8" stroke="#5fd08a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>'
                : '<path d="M4.5 4.5l7 7M11.5 4.5l-7 7" stroke="#f0736a" stroke-width="1.6" stroke-linecap="round"/>'}</svg>
              <span style="font-size:12.5px;color:var(--fg2);flex-grow:1">${k}</span>
              <span class="mono" style="font-size:12px;color:${ok?"#7ddba4":"var(--lose-t)"}">${v}</span></div>`).join("")}
        </div>
        <div class="card pad">
          <div class="eyebrow" style="margin-bottom:13px">1회 비용</div>
          <div><span class="mono" style="font-size:29px;font-weight:600">$${cost.toFixed(2)}</span>
            <span class="faint" style="font-size:11.5px"> / 회</span></div>
          <div class="mono muted" style="font-size:11px;line-height:1.9;margin-top:11px">
            입력 ${d.input_tokens.toLocaleString()} × $5/1M<br>
            출력 ${d.output_tokens.toLocaleString()} × $25/1M</div>
          <div class="mono faint" style="font-size:10.5px;margin-top:10px">${esc(d.report_date)} · ${esc(d.model)}</div>
        </div>
      </div>
    </div>`;
}

// -------------------------------------------------------------------- 탭 --
const LOADERS = {today:loadToday, explore:loadExplore, report:loadReport, coach:loadCoach};
const loaded = {};
function show(tab){
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on", b.dataset.tab===tab));
  document.querySelectorAll("main section").forEach(s=>s.classList.toggle("on", s.id===tab));
  if(!loaded[tab]){ loaded[tab]=true; LOADERS[tab](); }
}
document.querySelectorAll("nav button").forEach(b=> b.onclick=()=>show(b.dataset.tab));
show("today");
</script>
</body>
</html>
